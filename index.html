<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cờ Vua - Chơi với máy hoặc 2 người</title>
  <meta name="theme-color" content="#12161b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-classic">
  <div class="app-container">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">♞</span><h1>Cờ Vua</h1></div>
      <div class="topbar-actions">
        <button id="btnSettings" class="btn icon-btn" aria-label="Cài đặt ván">⚙</button>
      </div>
    </header>

    <main class="game-layout">
      <div class="board-section">
        <div class="player-bar top-player" id="topPlayerBar">
          <div class="player-info">
            <span class="player-name" id="topPlayerName">Máy (Đen)</span>
            <div class="captured-pieces" id="topCaptured"></div>
          </div>
          <div class="chess-clock hidden" id="topClock">10:00</div>
        </div>

        <div class="board-wrapper">
          <div id="chessBoard" class="chess-board"></div>
        </div>

        <div class="player-bar bottom-player" id="bottomPlayerBar">
          <div class="player-info">
            <span class="player-name" id="bottomPlayerName">Bạn (Trắng)</span>
            <div class="captured-pieces" id="bottomCaptured"></div>
          </div>
          <div class="chess-clock hidden" id="bottomClock">10:00</div>
        </div>
        <div class="action-bar">
          <button id="btnNewGame" class="btn act"><span class="ico">＋</span>Ván mới</button>
          <button id="btnUndo" class="btn act"><span class="ico">↶</span>Đi lại</button>
          <button id="btnHint" class="btn act"><span class="ico">💡</span>Gợi ý</button>
          <button id="btnFlip" class="btn act"><span class="ico">⇅</span>Xoay</button>
          <button id="btnSound" class="btn act" title="Bật/Tắt âm thanh" aria-label="Âm thanh">🔊</button>
        </div>
      </div>

      <aside class="sidebar">
        <div class="status-card">
          <div class="mode-badge" id="modeBadge">Chế độ: Cờ Vua Chuẩn</div>
          <div class="turn-indicator" id="turnIndicator">Lượt: Trắng</div>
          <div class="game-status" id="gameStatus">Trận đấu đang diễn ra</div>
        </div>

        <div class="history-card">
          <h3>Lịch Sử Nước Đi</h3>
          <div class="move-list" id="moveList"></div>
        </div>

        <details class="fen-card">
          <summary>Thế cờ (FEN)</summary>
          <div class="fen-row">
            <input type="text" id="fenInput" placeholder="Dán chuỗi FEN tại đây..." aria-label="Chuỗi FEN" />
          </div>
          <div class="fen-actions">
            <button id="btnCopyFen" class="btn small">Sao chép FEN</button>
            <button id="btnLoadFen" class="btn small primary">Nạp FEN</button>
          </div>
        </details>
      </aside>
    </main>
  </div>


  <section id="settingsSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Cài đặt ván">
    <div class="sheet-card">
      <div class="sheet-head"><h2>Cài đặt ván</h2><button id="btnSettingsClose" class="sheet-close" aria-label="Đóng">✕</button></div>
      <label class="field">Tính năng trò chơi
        <select id="specialMode">
          <option value="classic" selected>Cờ vua chuẩn (FIDE)</option>
          <option value="parasite">Ký sinh kỹ năng (Ăn quân hấp thụ)</option>
        </select>
      </label>
      <label class="field">Chế độ chơi
        <select id="gameMode"><option value="pve" selected>Đấu với máy</option><option value="pvp">2 người chơi chung máy</option></select></label>
      <label class="field">Bạn cầm quân
        <select id="playerSide"><option value="w" selected>Trắng</option><option value="b">Đen</option></select></label>
      <label class="field">Độ khó của máy
        <select id="aiLevel"><option value="1">Dễ</option><option value="2" selected>Trung bình</option><option value="3">Khó</option></select></label>
      <label class="field">Đồng hồ
        <select id="timeControl"><option value="none" selected>Không giới hạn</option><option value="180+2">Blitz 3+2</option><option value="600+0">Rapid 10 phút</option></select></label>
      <label class="field">Màu bàn cờ
        <select id="boardTheme"><option value="theme-classic" selected>Xanh lá</option><option value="theme-wood">Gỗ ấm</option><option value="theme-ocean">Xanh dương</option></select></label>
      <button id="btnSettingsDone" class="btn primary wide">Xong</button>
    </div>
  </section>

  <!-- Modal Phong Cấp -->
  <div id="promotionModal" class="modal hidden">
    <div class="modal-content">
      <h3>Chọn quân phong cấp</h3>
      <div class="promotion-options" id="promotionOptions"></div>
    </div>
  </div>

  <!-- Modal Kết Thúc -->
  <div id="gameOverModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="gameOverTitle">Kết Thúc Ván Đấu</h2>
      <p id="gameOverReason"></p>
      <button id="btnModalNewGame" class="btn primary">Chơi Ván Mới</button>
    </div>
  </div>

  <script>
    (() => {
      const s = document.getElementById('settingsSheet'), $ = id => document.getElementById(id);
      const open = () => s.classList.remove('hidden'), close = () => s.classList.add('hidden');
      $('btnSettings').addEventListener('click', open);
      $('btnSettingsClose').addEventListener('click', close);
      $('btnSettingsDone').addEventListener('click', close);
      s.addEventListener('click', e => { if (e.target === s) close(); });
    })();
  </script>
  <script src="pieces.js"></script>
  <script src="parasite.js"></script>
  <script src="engine.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
